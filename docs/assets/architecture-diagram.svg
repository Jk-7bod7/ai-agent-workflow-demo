<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="100%" height="100%">
  <defs>
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="card-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="card-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="620" rx="14" fill="url(#canvas-bg)" stroke="#334155" stroke-width="2" />

  <!-- Title Banner -->
  <text x="40" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Intelligent Lead Ingestion &amp; Triage Reference Architecture</text>
  <text x="40" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">n8n v2.46.6 • Node.js 22 LTS • SQLite WAL Mode • Cryptographic Idempotency • Docker Compose</text>

  <!-- Connectors (Paths) -->
  <path d="M 180 180 L 240 180" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 400 180 L 460 180" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 540 230 L 540 310" stroke="#f43f5e" stroke-width="2.5" fill="none" marker-end="url(#arrow-red)" />
  <path d="M 620 180 L 680 180" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)" />
  <path d="M 840 180 L 900 180" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  
  <path d="M 760 230 L 760 310" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 840 360 L 900 360" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)" />

  <!-- Node 1: Inbound Webhook -->
  <g transform="translate(40, 130)" filter="url(#drop-shadow)">
    <rect width="140" height="100" rx="10" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="70" y="32" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">INGRESS</text>
    <text x="70" y="55" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">HTTP Webhook</text>
    <text x="70" y="74" fill="#93c5fd" font-family="sans-serif" font-size="11" text-anchor="middle">X-Webhook-Secret</text>
    <text x="70" y="88" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">Fail-Closed 401</text>
  </g>

  <!-- Node 2: Normalize & SHA-256 -->
  <g transform="translate(240, 130)" filter="url(#drop-shadow)">
    <rect width="160" height="100" rx="10" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" />
    <text x="80" y="32" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">NORMALIZATION</text>
    <text x="80" y="55" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">SHA-256 Hash</text>
    <text x="80" y="74" fill="#d8b4fe" font-family="sans-serif" font-size="11" text-anchor="middle">NFKC String Clean</text>
    <text x="80" y="88" fill="#a855f7" font-family="sans-serif" font-size="10" text-anchor="middle">Deterministic ID</text>
  </g>

  <!-- Node 3: Validation Gate -->
  <g transform="translate(460, 130)" filter="url(#drop-shadow)">
    <polygon points="80,10 150,50 80,90 10,50" fill="#334155" stroke="#f59e0b" stroke-width="2" />
    <text x="80" y="47" fill="#fef3c7" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">RFC Valid?</text>
    <text x="80" y="62" fill="#fbbf24" font-family="sans-serif" font-size="10" text-anchor="middle">Budget &gt; 0?</text>
  </g>

  <!-- Node 4: DLQ (Below Gate) -->
  <g transform="translate(460, 310)" filter="url(#drop-shadow)">
    <rect width="160" height="90" rx="10" fill="url(#card-rose)" stroke="#f43f5e" stroke-width="1.5" />
    <text x="80" y="28" fill="#fecdd3" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">DEAD LETTER QUEUE</text>
    <text x="80" y="48" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">HTTP 422 Rejected</text>
    <text x="80" y="68" fill="#fda4af" font-family="sans-serif" font-size="10" text-anchor="middle">Isolated Quarantine</text>
  </g>

  <!-- Node 5: Priority Scoring -->
  <g transform="translate(680, 130)" filter="url(#drop-shadow)">
    <rect width="160" height="100" rx="10" fill="url(#card-amber)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="80" y="32" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">TRIAGE ENGINE</text>
    <text x="80" y="55" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Score &amp; SLA Math</text>
    <text x="80" y="74" fill="#fde68a" font-family="sans-serif" font-size="11" text-anchor="middle">P1 (1h) / P2 (4h) / P3 (24h)</text>
    <text x="80" y="88" fill="#fbbf24" font-family="sans-serif" font-size="10" text-anchor="middle">UTC Millisecond SLA</text>
  </g>

  <!-- Node 6: Demo CRM Ingestion -->
  <g transform="translate(900, 130)" filter="url(#drop-shadow)">
    <rect width="140" height="100" rx="10" fill="url(#card-emerald)" stroke="#34d399" stroke-width="1.5" />
    <text x="70" y="32" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">STORAGE</text>
    <text x="70" y="55" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Demo CRM API</text>
    <text x="70" y="74" fill="#6ee7b7" font-family="sans-serif" font-size="11" text-anchor="middle">SQLite WAL Mode</text>
    <text x="70" y="88" fill="#10b981" font-family="sans-serif" font-size="10" text-anchor="middle">Bearer Auth + Limits</text>
  </g>

  <!-- Node 7: Duplicate Filter & Executive Alert (Row 2) -->
  <g transform="translate(680, 310)" filter="url(#drop-shadow)">
    <polygon points="80,10 150,50 80,90 10,50" fill="#334155" stroke="#38bdf8" stroke-width="2" />
    <text x="80" y="47" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Is Duplicate?</text>
    <text x="80" y="62" fill="#38bdf8" font-family="sans-serif" font-size="9" text-anchor="middle">200 DUPLICATE</text>
  </g>

  <g transform="translate(900, 310)" filter="url(#drop-shadow)">
    <rect width="140" height="90" rx="10" fill="url(#card-rose)" stroke="#f43f5e" stroke-width="1.5" />
    <text x="70" y="28" fill="#fecdd3" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">EXECUTIVE ALERT</text>
    <text x="70" y="48" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">P1 Priority Alert</text>
    <text x="70" y="68" fill="#fda4af" font-family="sans-serif" font-size="10" text-anchor="middle">CRM Alert Registry</text>
  </g>

  <!-- Row 3: Companion SLA Watchdog -->
  <g transform="translate(40, 460)" filter="url(#drop-shadow)">
    <rect width="1000" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="30" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700">COMPANION SCHEDULED DAEMON (sla-monitor-workflow.json)</text>
    <text x="30" y="58" fill="#cbd5e1" font-family="sans-serif" font-size="13">Hourly Cron Trigger ➔ Poll Overdue CRM Leads (<tspan fill="#f59e0b">now &gt; sla_deadline</tspan>) ➔ Idempotent Escalation Dispatch</text>
    <text x="30" y="84" fill="#64748b" font-family="sans-serif" font-size="11">Escalation idempotency prevents repeated alert storms: updates lead state to ESCALATED and rejects duplicate breaches.</text>
  </g>
</svg>